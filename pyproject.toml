[project]
name = "gemini-buddy-mcp"
version = "0.2.0"
description = "Stdio MCP server that lets Claude consult Gemini (agy CLI, subscription), have it review diffs and analyse media, generate images / speech (google-genai, API credit), and prepare / measure media locally, with persistent sessions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10",
    "google-genai>=1.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
# local media tools (media_*): frames / overlays (Pillow), mix balance (numpy), tracking (OpenCV),
# and an ffmpeg binary when none is on PATH
media = ["Pillow>=10", "numpy>=1.26", "opencv-python-headless>=4.8", "imageio-ffmpeg>=0.5"]

[project.scripts]
gemini-buddy-mcp = "server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]
packages = ["gemini_buddy"]
